# ─────────────────────────────────────────────────────────────────────────────
# HANS panel — Seeed reTerminal E1002 (7.3" E Ink Spectra 6, ESP32-S3)
#
# The device does no layout work: it pulls a finished 800x480 PNG from
# /api/epaper.png and paints it. All rendering lives in the Nuxt app, so
# changing the design never means reflashing.
#
# Standalone ESPHome — no Home Assistant required. Build and flash with:
#   uvx esphome run firmware/hans_display/hans-display.yaml
#
# Pin map is Seeed's, verified against the community config at
# github.com/manuveli/esphome-reterminal-e1002.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: hans-display
  # Sparrow id this panel reports its own SHT4x readings under. Must exist in
  # the devices table before Supabase will accept the inserts.
  sparrow_id: hallway
  dashboard_url: !secret hans_dashboard_url
  # Flip to "true" to let the panel sleep again. While false it stays awake and
  # reachable, which is what iterating on the layout needs — a sleeping panel
  # is only online for 90 seconds out of every 15 minutes.
  sleep_between_refreshes: "false"

esphome:
  name: ${device_name}
  # For esp_sleep_get_wakeup_cause() in the boot handler.
  includes:
    - esp_sleep_shim.h
  friendly_name: Hans Display
  on_boot:
    priority: 600
    then:
      # Wi-Fi and SNTP need a moment before the first fetch can succeed.
      # A pin wake means someone pressed Page Down; a timer wake must not move
      # the page. esp_sleep_get_wakeup_cause is the only thing that tells them
      # apart, since the pin is claimed by the sleep component.
      - lambda: |-
          auto cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1 ||
              cause == ESP_SLEEP_WAKEUP_GPIO) {
            id(page_index) += 1;
            ESP_LOGI("hans", "woken by the button — advancing to page %d", id(page_index));
          }
      - output.turn_on: battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # Wi-Fi and SNTP need a moment before the first fetch can succeed.
      - delay: 20s
      - script.execute: refresh_dashboard

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Seeed routes the USB-C port through a CH340 bridge on UART0 rather than the
# ESP32-S3's native USB. ESPHome would otherwise default to USB_SERIAL_JTAG on
# this chip and the serial log would go to a peripheral nothing is attached to.
logger:
  hardware_uart: UART0

# Not Home Assistant-specific: this is also what `esphome logs` connects to
# once the cable is out and updates happen over the air.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

# Handy during bring-up: status, logs and a manual refresh button at
# http://${device_name}.local. Only reachable while the device is awake.
web_server:
  version: 3

http_request:
  # The ESP-IDF build ships no CA bundle. Same posture as the sparrow firmware:
  # the only secret on the wire is a scoped token, over the home LAN.
  verify_ssl: false
  timeout: 20s
  watchdog_timeout: 25s

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# GPIO19/20 double as the native USB-Serial-JTAG pins, so ESPHome warns here.
# Harmless on this board: serial runs over the CH340 on UART0 instead.
i2c:
  sda: GPIO19
  scl: GPIO20

# ─── The dashboard image ─────────────────────────────────────────────────────

# The panel is the only thing that can measure its own charge, so it appends
# the value to the request and the server draws it into the header.
# A plain counter, not a page name. The server takes it modulo however many
# pages exist, so adding a page never means reflashing the panel.
globals:
  - id: page_index
    type: int
    # Survives deep sleep — otherwise every wake would reset to the first page
    # and the buttons would appear not to work at all.
    restore_value: true
    initial_value: '0'

script:
  - id: refresh_dashboard
    then:
      - lambda: |-
          char url[320];
          snprintf(url, sizeof(url), "${dashboard_url}&battery=%d&page=%d",
                   (int) roundf(id(battery_level).state), id(page_index));
          id(dashboard_image).set_url(url);
      - component.update: dashboard_image

online_image:
  - id: dashboard_image
    url: ${dashboard_url}
    format: PNG
    type: RGB565
    buffer_size: 65536
    on_download_finished:
      - component.update: epaper_display
    on_error:
      - logger.log: "dashboard fetch failed — keeping the last frame on screen"

display:
  - platform: epaper_spi
    id: epaper_display
    model: 7.3in-spectra-e6
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # Driven explicitly — a full colour refresh takes ~25 s and must only ever
    # run when there is a newly downloaded frame to show.
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

# ─── Refresh schedule ────────────────────────────────────────────────────────

# Quiet-hours check on boot, and the refresh cadence while sleeping is off.
# When the panel does sleep it never reaches this trigger and sleep_duration
# sets the pace instead; the two never both apply.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: /15
        then:
          - if:
              condition:
                and:
                  - lambda: 'return !${sleep_between_refreshes};'
                  - lambda: |-
                      auto now = id(sntp_time).now();
                      return !(now.hour >= 1 && now.hour < 6);
              then:
                - component.update: battery_voltage
                - component.update: battery_level
                - script.execute: refresh_dashboard

# ─── Onboard sensors ─────────────────────────────────────────────────────────
# The panel has an SHT4x, so it doubles as a sparrow and reports the room it
# stands in back to Supabase on the same 5-minute cadence as the others.

sensor:
  - platform: sht4x
    update_interval: 5min
    temperature:
      name: Temperature
      id: temp_sensor
      on_value:
        - http_request.post:
            url: !secret supabase_readings_url
            request_headers:
              Content-Type: application/json
              apikey: !secret supabase_anon_key
              Authorization: !secret supabase_auth_header
              Prefer: return=minimal
            body: !lambda |-
              char buf[160];
              snprintf(buf, sizeof(buf),
                       "{\"sparrow_id\":\"${sparrow_id}\",\"metric\":\"temperature\",\"value\":%.2f}",
                       x);
              return std::string(buf);
    humidity:
      name: Humidity
      id: hum_sensor
      on_value:
        - http_request.post:
            url: !secret supabase_readings_url
            request_headers:
              Content-Type: application/json
              apikey: !secret supabase_anon_key
              Authorization: !secret supabase_auth_header
              Prefer: return=minimal
            body: !lambda |-
              char buf[160];
              snprintf(buf, sizeof(buf),
                       "{\"sparrow_id\":\"${sparrow_id}\",\"metric\":\"humidity\",\"value\":%.2f}",
                       x);
              return std::string(buf);

  - platform: adc
    pin: GPIO1
    name: Battery Voltage
    id: battery_voltage
    update_interval: 5min
    attenuation: 12db
    filters:
      - multiply: 2.0   # on-board divider

  # Voltage is what the ADC gives; the curve turns it into something readable
  # on the panel. Li-ion discharge is far from linear, hence the point list.
  - platform: template
    name: Battery Level
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 5min
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s

output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

binary_sensor:
  # Page Down lives on GPIO4, which is the deep-sleep wake pin and therefore
  # cannot also be a binary_sensor — pressing it wakes the panel, and the boot
  # handler reads the wake cause to advance the page. These two only respond
  # while the panel is already awake.
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key_page_up
    name: Page Up
    on_press:
      - lambda: 'id(page_index) -= 1;'
      - script.execute: refresh_dashboard

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key_refresh
    name: Refresh Button
    on_press:
      - script.execute: refresh_dashboard

# ─── Deep sleep ──────────────────────────────────────────────────────────────
# Measured before this was enabled: about 2 percentage points of battery per
# hour, so a day and a half per charge. The panel is only actually needed for
# the minute it takes to fetch and repaint.
#
# run_duration is a ceiling, not a target. A cycle runs roughly: associate (a
# few seconds), fetch (~3 s), repaint (~30 s, and the Spectra-6 refresh must
# not be cut off midway). 90 s leaves room for a slow association without
# risking a half-painted screen.
#
# GPIO4 (Page Down) is the wake pin, so pressing it both wakes the panel and
# advances the page — see the wake-cause check in on_boot. Page Up and Refresh
# only respond while the panel is already awake, which with two pages costs
# nothing: one direction reaches either.
deep_sleep:
  id: deep_sleep_1
  run_duration: 90s
  sleep_duration: 15min
  wakeup_pin:
    number: GPIO4
    mode: INPUT_PULLUP
    inverted: true
  wakeup_pin_mode: INVERT_WAKEUP
